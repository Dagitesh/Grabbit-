# Grabbit — CI (backend tests + Flutter analyze/test; debug APK on default branch)
#
# Branches: edit the lists below to match your default branch (e.g. only `main`, or add `staging`).
# If your repo uses a single default branch, set e.g. `branches: [main]` for both push and pull_request.
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: ci-access-secret-must-be-long-enough-for-jwt
          JWT_REFRESH_SECRET: ci-refresh-secret-must-be-long-enough-for-jwt
        run: npm test

  flutter:
    name: Flutter (analyze & test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grabbit_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      # Errors and warnings fail the job. Info-level hints (e.g. deprecations) are non-fatal
      # so CI stays green while you migrate APIs. For full strictness locally: `flutter analyze`
      # with no flags, or remove --no-fatal-infos here after fixing all hints.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

  # Debug APK avoids release signing requirements in CI. For signed release builds, add
  # Android signing secrets (key.properties / keystore) and switch to: flutter build apk --release
  flutter-build-apk:
    name: Flutter (debug APK)
    runs-on: ubuntu-latest
    needs: [flutter]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    defaults:
      run:
        working-directory: grabbit_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: grabbit_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
